<!doctype html>

<html lang="en">
<head>
	<meta charset="utf-8">

	<title>Gerador de Diálogos</title>
	<meta name="description" content="Gerador de Diálogos">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>
		* {
			box-sizing: border-box;
		}
		
		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: #1a1a1a;
			margin: 0;
			padding: 10px;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		
		.container {
			max-width: 600px;
			width: 100%;
			background: #1e1e2e;
			border-radius: 15px;
			padding: 15px;
			box-shadow: 0 10px 30px rgba(0,0,0,0.5);
		}
		
		h1 {
			text-align: center;
			background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			margin: 0 0 15px 0;
			font-size: 1.5em;
		}
		
		.canvas-container {
			display: flex;
			justify-content: center;
			margin-bottom: 15px;
			background: #2a2a3e;
			border-radius: 8px;
			padding: 10px;
		}
		
		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: #2a2a3e;
			margin: 0;
			padding: 10px;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}
		
		#death {
			max-width: 100%;
			height: auto;
			image-rendering: pixelated;
		}
		
		#border {
			display: none;
		}
		
		.controls {
			display: flex;
			flex-direction: column;
			gap: 10px;
			margin-bottom: 10px;
		}
		
		.control-row {
			display: flex;
			gap: 8px;
		}
		
		.control-group {
			flex: 1;
			display: flex;
			flex-direction: column;
		}
		
		.control-group label {
			font-weight: 600;
			color: #b0b0c0;
			margin-bottom: 4px;
			font-size: 14px;
		}
		
		label {
			font-weight: 600;
			color: #b0b0c0;
			margin-bottom: 4px;
			font-size: 14px;
		}
		
		.control-group select,
		.control-group textarea {
			padding: 8px;
			border: 2px solid #3a3a4e;
			border-radius: 6px;
			font-size: 14px;
			background: #2a2a3e;
			color: #e0e0e0;
			transition: border-color 0.3s;
		}
		
		.control-group select:focus,
		.control-group textarea:focus {
			outline: none;
			border-color: #ff6b9d;
		}
		
		.control-group textarea {
			resize: vertical;
			min-height: 60px;
			font-family: inherit;
		}
		
		.overlays {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}
		
		.overlays label {
			margin: 0;
			flex: 1;
		}
		
		.overlays select {
			width: 100%;
		}
		
		.save-button {
			display: flex;
			width: 60px;
			height: 60px;
			margin: 20px auto 0;
			padding: 0;
			background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
			color: white;
			border: none;
			border-radius: 50%;
			font-size: 12px;
			font-weight: 600;
			cursor: pointer;
			transition: transform 0.2s, box-shadow 0.2s;
			align-items: center;
			justify-content: center;
		}
		
		.save-button:hover {
			transform: translateY(-1px);
			box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
		}
		
		.save-button:active {
			transform: translateY(0);
		}
		
		@media (max-width: 480px) {
			.control-row {
				flex-direction: column;
			}
			
			.overlays {
				flex-direction: column;
			}
			
			.container {
				padding: 10px;
				border-radius: 10px;
			}
			
			h1 {
				font-size: 1.3em;
			}
		}
		
		.source {
			display: none;
		}
	</style>

	<!-- Jquery -->
	<script src="js/jquery-3.2.1.min.js"></script>
	<script src="js/jquery.waitforimages.min.js"></script>
	<script src="js/linebreak.js"></script>

</head>

<body>
	<div class="container">
		<h1>Gerador de Diálogos</h1>
		
		<div class="canvas-container">
			<canvas id="death"></canvas>
			<canvas id="border"></canvas>
		</div>
		
		<div class="controls">
			<div class="control-row">
				<div class="control-group">
					<label for="sourcetext">Texto</label>
					<textarea id="sourcetext" cols="40" rows="6"></textarea>
				</div>
				
				<div class="control-group overlays">
					<!-- Character and expression selectors will be inserted here by JS -->
				</div>
			</div>
		</div>
	</div>
	
	<a href="#" id="save" class="save-button">
		<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
			<polyline points="17 21 17 13 7 13 7 21"></polyline>
			<polyline points="7 3 7 8 15 8"></polyline>
		</svg>
	</a>

	<!-- Other/Main Scripts after DOM load -->
	<script src="js/generators.js"></script>
	<script src="js/scripts.js"></script>
	<script>
		// Automatically load Wargroove generator
		if(window.location.hash.length === 0 || window.location.hash === '#gallery'){
			window.location.hash = '#wargroove';
		}
	</script>

</body>

</html>
