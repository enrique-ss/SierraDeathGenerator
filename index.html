<!doctype html>

<html lang="pt-BR">
<head>
	<meta charset="utf-8">

	<title>Gerador de Diálogos</title>
	<meta name="description" content="Gerador de Diálogos">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>
		* {
			box-sizing: border-box;
		}
		
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
			background: #111118;
			margin: 0;
			padding: 24px;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
		}
		
		.container {
			width: 100%;
			max-width: 960px;
		}
		
		h1 {
			text-align: center;
			background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			margin: 0 0 24px 0;
			font-size: 1.8em;
			font-weight: 700;
		}

		.main-layout {
			display: flex;
			flex-direction: column;
			gap: 24px;
			align-items: center;
		}
		
		.canvas-container {
			display: flex;
			justify-content: center;
			align-items: center;
			width: 100%;
			max-width: 560px;
		}
		
		#death {
			width: 100%;
			height: auto;
			image-rendering: pixelated;
		}
		
		#border {
			display: none;
		}
		
		.controls {
			width: 100%;
			max-width: 560px;
			display: flex;
			flex-direction: column;
			gap: 12px;
		}
		
		.control-row {
			display: flex;
			gap: 10px;
		}
		
		.control-group {
			flex: 1;
			display: flex;
			flex-direction: column;
		}
		
		.control-group label {
			font-weight: 600;
			color: #8f8f9d;
			margin-bottom: 6px;
			font-size: 13px;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}
		
		label {
			font-weight: 600;
			color: #8f8f9d;
			margin-bottom: 6px;
			font-size: 13px;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}
		
		.control-group select,
		.control-group textarea,
		.control-group input[type="text"] {
			padding: 10px 12px;
			border: 2px solid #29293a;
			border-radius: 6px;
			font-size: 14px;
			background: #222232;
			color: #e2e2e9;
			transition: border-color 0.2s, box-shadow 0.2s;
			width: 100%;
		}
		
		.control-group select:focus,
		.control-group textarea:focus,
		.control-group input[type="text"]:focus {
			outline: none;
			border-color: #ff6b9d;
			box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.15);
		}
		
		.control-group textarea {
			resize: vertical;
			min-height: 40px;
			font-family: inherit;
		}


		
		.overlays {
			display: flex;
			flex-direction: row;
			flex-wrap: wrap;
			gap: 10px;
		}
		
		.overlays label {
			margin: 0;
			flex: 1 1 95px;
			display: flex;
			flex-direction: column;
			gap: 6px;
			min-width: 95px;
		}
		
		.save-button {
			display: flex;
			width: 52px;
			height: 52px;
			margin: 20px auto 0;
			padding: 0;
			background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
			color: white;
			border: none;
			border-radius: 50%;
			font-size: 12px;
			font-weight: 600;
			cursor: pointer;
			transition: transform 0.2s, box-shadow 0.2s;
			align-items: center;
			justify-content: center;
		}
		
		.save-button:hover {
			transform: translateY(-2px);
			box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
		}
		
		.save-button:active {
			transform: translateY(0);
		}
		
		@media (max-width: 768px) {
			body {
				padding: 16px;
			}

			.main-layout {
				flex-direction: column;
			}
			
			.canvas-container {
				max-width: 100%;
			}
			
			h1 {
				font-size: 1.4em;
			}
		}
		
		.source {
			display: none;
		}
	</style>

	<!-- Jquery -->
	<script src="js/jquery-3.2.1.min.js"></script>
	<script src="js/jquery.waitforimages.min.js"></script>
	<script src="js/linebreak.js"></script>

</head>

<body>
	<div class="container">
		<h1>Gerador de Diálogos</h1>
		
		<div class="main-layout">
			<div class="canvas-container">
				<canvas id="death"></canvas>
				<canvas id="border"></canvas>
			</div>
			
			<div class="controls">
				<div class="control-group">
					<label for="sourcetext">Texto</label>
					<textarea id="sourcetext" cols="40" rows="3"></textarea>
				</div>
				
				<div class="control-group overlays">
					<label for="ato" class="overlay-label no-group">
						Nó:
						<input type="text" id="ato" name="ato" autocomplete="off">
					</label>
					<!-- Character and expression selectors will be inserted here by JS -->
				</div>
			</div>
		</div>
	</div>
	
	<a href="#" id="save" class="save-button">
		<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
			<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
			<polyline points="17 21 17 13 7 13 7 21"></polyline>
			<polyline points="7 3 7 8 15 8"></polyline>
		</svg>
	</a>

	<!-- Other/Main Scripts after DOM load -->
	<script src="js/generators.js"></script>
	<script src="js/scripts.js"></script>
	<script>
		// Force Wargroove generator to load immediately
		window.location.hash = '#wargroove';
	</script>

</body>

</html>
